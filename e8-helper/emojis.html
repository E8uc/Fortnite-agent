<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08101f">
  <meta name="description" content="Choose emojis from this server and tell E8 when each one fits.">
  <title>Custom Emojis • E8 Helper</title>
  <link rel="stylesheet" href="./styles.css?v=20260923-4">
</head>
<body data-page="emojis">
  <div id="toast" class="toast" aria-live="polite"></div>
  <main class="page">
    <div class="page-shell">
      <section id="loading" class="panel loading"><span class="spinner"></span><p>Opening E8 Helper…</p></section>
      <section id="authRequired" class="panel auth-required hidden"><h2>Sign in to continue</h2><p>Your E8 Helper settings are managed from the website.</p><button id="signInAgain" class="primary">Sign in with Discord</button></section>
      <div id="pageContent" class="hidden">
        <div class="page-head"><div><span class="eyebrow">Custom Emojis</span><h1>Custom Emojis</h1><p>Choose emojis from this server and tell E8 when each one fits.</p></div><span id="saveState" class="save-state">Saved</span></div>
        
<div class="page-grid">
  <div><button id="addEmoji" class="secondary">Add custom emoji</button></div>
  <div id="emojiList" class="emoji-list"></div>
</div>
      </div>
      <dialog id="emojiDialog" class="emoji-dialog"><div class="dialog-head"><div><span class="eyebrow">Custom Emojis</span><h3>Choose an emoji</h3></div><button id="closeEmoji" class="close">×</button></div><div id="emojiGrid" class="emoji-grid"></div></dialog>
    </div>
  </main>
  <script src="./app.js?v=20260923-11" defer></script>
</body>
</html>
