<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08101f">
  <meta name="description" content="Default: 2:00 PM to 11:00 PM in your chosen timezone.">
  <title>Schedule • E8 Helper</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body data-page="schedule">
  <div id="toast" class="toast" aria-live="polite"></div>
  <main class="page">
    <div class="page-shell">
      <section id="loading" class="panel loading"><span class="spinner"></span><p>Opening E8 Helper…</p></section>
      <section id="authRequired" class="panel auth-required hidden"><h2>Sign in to continue</h2><p>Your E8 Helper settings are managed from the website.</p><button id="signInAgain" class="primary">Sign in with Discord</button></section>
      <div id="pageContent" class="hidden">
        <div class="page-head"><div><span class="eyebrow">Schedule</span><h1>Schedule</h1><p>Default: 2:00 PM to 11:00 PM in your chosen timezone.</p></div><span id="saveState" class="save-state">Saved</span></div>
        
<div class="settings-grid">
  <div class="panel setting"><label>Wake time</label><input id="wakeTime" type="time" value="14:00"></div>
  <div class="panel setting"><label>Sleep time</label><input id="sleepTime" type="time" value="23:00"></div>
  <div class="panel setting wide"><label>Timezone</label><input id="timeZone" type="text" list="tzList" autocomplete="off"><datalist id="tzList"><option value="Asia/Baghdad"><option value="America/New_York"><option value="Europe/London"><option value="Asia/Dubai"><option value="Asia/Riyadh"><option value="Australia/Sydney"></datalist><span>Wake and sleep times use this timezone.</span></div>
</div>
      </div>
      
    </div>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>
