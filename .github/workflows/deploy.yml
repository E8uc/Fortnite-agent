name: Deploy Fortnite Ai Agent

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore deployed NovaSparx Layer 8 runtime
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/restore-pages-runtime.sh Fortnite-Ai-Agent-GitHub-Cloudflare
          touch Fortnite-Ai-Agent-GitHub-Cloudflare/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Fortnite Ai Agent
        uses: actions/upload-pages-artifact@v3
        with:
          path: Fortnite-Ai-Agent-GitHub-Cloudflare

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
