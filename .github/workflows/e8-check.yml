name: E8 platform checks

on:
  push:
    branches:
      - e8-platform-development
      - main
    paths:
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/E8Hub/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/E8AI/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/Settings/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/Support/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/e8/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/cloudflare-worker/**"
      - "AGENTS.md"
      - ".github/workflows/e8-check.yml"
  pull_request:
    paths:
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/E8Hub/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/E8AI/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/Settings/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/Support/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/e8/**"
      - "Fortnite-Ai-Agent-GitHub-Cloudflare/cloudflare-worker/**"
      - "AGENTS.md"
      - ".github/workflows/e8-check.yml"

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/e8/e8-auth.js
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/e8/e8-shell.js
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/e8/e8-database.js
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/e8/e8-ai.js
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/e8/e8-settings.js
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/e8/e8-support.js
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/e8/e8-frame-guard.js
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/cloudflare-worker/e8-admin-guard.js
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/cloudflare-worker/e8-gateway.js
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/cloudflare-worker/e8-entry.js
          node --check Fortnite-Ai-Agent-GitHub-Cloudflare/cloudflare-worker/worker.js

      - name: Wrangler dry-run bundle
        working-directory: Fortnite-Ai-Agent-GitHub-Cloudflare/cloudflare-worker
        run: npx --yes wrangler@4.134.0 deploy --dry-run --outdir /tmp/e8-worker-build

      - name: Validate E8 static references and invariants
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path("Fortnite-Ai-Agent-GitHub-Cloudflare")
          worker_dir = root / "cloudflare-worker"
          html_files = [
              root / "E8Hub/index.html",
              root / "E8AI/index.html",
              root / "Settings/index.html",
              root / "Support/index.html",
          ]

          class RefParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == "script" and values.get("src"):
                      self.refs.append(values["src"])
                  if tag == "link" and values.get("href"):
                      self.refs.append(values["href"])

          missing = []
          for html in html_files:
              parser = RefParser()
              parser.feed(html.read_text(encoding="utf-8"))
              for ref in parser.refs:
                  if ref.startswith(("http://", "https://", "data:", "#")):
                      continue
                  target = (html.parent / ref.split("?", 1)[0]).resolve()
                  if not target.exists():
                      missing.append(f"{html}: {ref}")

          if missing:
              raise SystemExit("Missing local references:\n" + "\n".join(missing))

          settings = (root / "e8/e8-settings.js").read_text(encoding="utf-8")
          support = (root / "e8/e8-support.js").read_text(encoding="utf-8")
          support_html = (root / "Support/index.html").read_text(encoding="utf-8")
          frame_guard = (root / "e8/e8-frame-guard.js").read_text(encoding="utf-8")
          admin_guard = (worker_dir / "e8-admin-guard.js").read_text(encoding="utf-8")
          gateway = (worker_dir / "e8-gateway.js").read_text(encoding="utf-8")
          worker = (worker_dir / "e8-entry.js").read_text(encoding="utf-8")
          wrangler = (worker_dir / "wrangler.toml").read_text(encoding="utf-8")
          package = (worker_dir / "package.json").read_text(encoding="utf-8")
          expected = r"^E8[A-Za-z0-9]{15}uC$"
          if expected not in settings or expected not in support or expected not in worker:
              raise SystemExit("E8 ID invariant is inconsistent")

          ai = (root / "e8/e8-ai.js").read_text(encoding="utf-8")
          if "const SUGGESTION_LIMIT = 5;" not in ai or "slice(0, SUGGESTION_LIMIT)" not in ai:
              raise SystemExit("E8AI must show exactly five randomized suggestions")
          if "Fortnite: Object.freeze([" not in ai or "More: Object.freeze([" not in ai:
              raise SystemExit("E8AI suggestion categories are missing")
          if "buildClientContext(content)" not in ai:
              raise SystemExit("E8AI asset context integration is missing")
          if '"X-E8-Client": "hub-v1"' not in ai:
              raise SystemExit("E8AI subscription routing marker is missing")

          hub = (root / "E8Hub/index.html").read_text(encoding="utf-8")
          if '<div class="e8-label"><span>Soon</span></div>' not in hub:
              raise SystemExit("Soon must remain a non-clickable label")

          if 'id="revokeSubscription"' not in support_html:
              raise SystemExit("Support revoke control is missing")
          if 'autocomplete="new-password"' not in support_html:
              raise SystemExit("Support credential input must discourage password-manager autofill")
          if '"/e8/admin/subscription/revoke"' not in support or '"/e8/admin/subscription/revoke"' not in worker:
              raise SystemExit("Support revoke flow is incomplete")
          if "localStorage" in support or "sessionStorage" in support:
              raise SystemExit("Support staff tokens must never be persisted in web storage")
          if "TOKEN_IDLE_MS" not in support or support.count("window.confirm") < 2:
              raise SystemExit("Support confirmation/token-idle safeguards are missing")
          if "newOperationId" not in support or support.count("operationId: newOperationId()") < 2:
              raise SystemExit("Support mutation operation IDs are missing")
          if 'class="e8-frame-guard"' not in support_html or "e8-frame-guard.js" not in support_html:
              raise SystemExit("Sensitive support page frame guard is missing")
          if "window.top === window.self" not in frame_guard:
              raise SystemExit("Frame guard implementation is incomplete")

          if 'main = "e8-gateway.js"' not in wrangler:
              raise SystemExit("Wrangler must deploy the hardened E8 gateway")
          if '"wrangler": "4.134.0"' not in package:
              raise SystemExit("Wrangler dependency must stay exactly pinned")
          if 'import e8Worker from "./e8-entry.js";' not in gateway:
              raise SystemExit("E8 gateway must forward into the E8 account layer")
          if 'import { withAdminReplayGuard } from "./e8-admin-guard.js";' not in gateway:
              raise SystemExit("E8 admin replay guard is not wired into the gateway")
          if "sanitizeClientContext" not in gateway or "cleanLabel" not in gateway:
              raise SystemExit("E8 gateway context sanitization is missing")
          if "OPERATION_RE" not in admin_guard or "inFlight" not in admin_guard or "completed" not in admin_guard:
              raise SystemExit("E8 admin replay guard invariants are missing")
          if "configuredAdminTokens" not in admin_guard or "authorizedScope" not in admin_guard:
              raise SystemExit("E8 admin replay guard must revalidate the current staff credential")
          if 'const cacheKey = `${authScope}:${operationId}`;' not in admin_guard:
              raise SystemExit("E8 admin replay cache must be scoped to the authorized staff token")
          if 'if (!allowedOrigins(env).has(origin)) return handler(request);' not in admin_guard:
              raise SystemExit("E8 admin replay guard must not bypass origin checks")
          if "completed.get(operationId)" in admin_guard or "inFlight.get(operationId)" in admin_guard:
              raise SystemExit("E8 admin replay cache must never be globally keyed by operation ID alone")
          if 'import legacyWorker from "./worker.js";' not in worker:
              raise SystemExit("E8 Worker must preserve the legacy Worker fallback")
          if 'account.effectivePlan !== "plus" && account.effectivePlan !== "premium"' not in worker:
              raise SystemExit("Plus/Premium enhanced-model inheritance guard is missing")
          if 'DEFAULT_ENHANCED_MODEL' not in worker:
              raise SystemExit("Enhanced E8AI model fallback is missing")

          dangerous_dom = (".innerHTML", ".outerHTML", "insertAdjacentHTML", "document.write(", "eval(", "new Function(")
          for source in (root / "e8").glob("*.js"):
              text = source.read_text(encoding="utf-8")
              bad = [token for token in dangerous_dom if token in text]
              if bad:
                  raise SystemExit(f"Unsafe DOM/code sink in {source}: {', '.join(bad)}")

          required_csp = ["default-src 'self'", "script-src 'self'", "object-src 'none'", "frame-src 'none'"]
          for html in html_files:
              text = html.read_text(encoding="utf-8")
              lower = text.lower()
              if "<script>" in lower or "onclick=" in lower or "onerror=" in lower or "javascript:" in lower:
                  raise SystemExit(f"Unsafe inline executable content found in {html}")
              for directive in required_csp:
                  if directive not in text:
                      raise SystemExit(f"Missing CSP directive {directive!r} in {html}")

          print("E8 static checks passed")
          PY
