name: FNAA v1 check

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          site='Fortnite-Ai-Agent-GitHub-Cloudflare'

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find "$site"               -type f               -name '*.js'               ! -path "$site/cloudflare-worker/*"               ! -path "$site/cloudflare-autolink/*"               -print0
          )

          # Cloudflare Workers are ES modules. Parse them explicitly as modules
          # so CI does not accidentally treat worker.js as CommonJS.
          node --input-type=module --check < "$site/cloudflare-worker/worker.js"
          node --input-type=module --check < "$site/cloudflare-autolink/worker.js"

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Fortnite-Ai-Agent-GitHub-Cloudflare/build_database.py

      - name: Validate JSON assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const files = [
            'Fortnite-Ai-Agent-GitHub-Cloudflare/pak-setup-v42.json',
            'Fortnite-Ai-Agent-GitHub-Cloudflare/cloudflare-autolink/package.json'
          ];

          for (const file of files) {
            JSON.parse(fs.readFileSync(file, 'utf8'));
          }
          NODE

      - name: Run NovaSparx asset diagnosis self-test
        shell: bash
        run: node Fortnite-Ai-Agent-GitHub-Cloudflare/novasparx-associations.selftest.mjs

      - name: Run NovaSparx browser memory self-test
        shell: bash
        run: node Fortnite-Ai-Agent-GitHub-Cloudflare/novasparx-browser-guard.selftest.mjs

      - name: Run NovaSparx browser transport security self-test
        shell: bash
        run: node Fortnite-Ai-Agent-GitHub-Cloudflare/novasparx-browser-transport.selftest.mjs

      - name: Verify required site files
        shell: bash
        run: |
          set -euo pipefail
          site='Fortnite-Ai-Agent-GitHub-Cloudflare'
          required=(
            'index.html'
            '404.html'
            'style.css'
            'config.js'
            'auth.js'
            'novasparx-browser-guard.js'
            'novasparx-core.js'
            'novasparx-browser-transport.js'
            'novasparx-browser-transport.selftest.mjs'
            'novasparx-random-access.js'
            'novasparx-local-parser.js'
            'novasparx-texture-runtime.js'
            'novasparx-layers.js'
            'novasparx-associations.js'
            'novasparx-renderer.js'
            'novasparx-exporter.js'
            'preview.js'
            'tools.js'
            'app.js'
            'cloudflare-worker/worker.js'
            'cloudflare-worker/wrangler.jsonc'
            'cloudflare-autolink/worker.js'
            'cloudflare-autolink/wrangler.jsonc'
          )

          for file in "${required[@]}"; do
            test -s "$site/$file" || {
              echo "Missing or empty required file: $site/$file" >&2
              exit 1
            }
          done

      - name: Verify local page assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const site = 'Fortnite-Ai-Agent-GitHub-Cloudflare';
          const html = fs.readFileSync(path.join(site, 'index.html'), 'utf8');
          const references = [...html.matchAll(/(?:src|href)="([^"#?]+)"/g)]
            .map((match) => match[1])
            .filter((value) => !/^(?:https?:|data:|mailto:|tel:|\/)/i.test(value));

          const missing = [...new Set(references)]
            .filter((value) => !fs.existsSync(path.join(site, value)));

          if (missing.length) {
            console.error(`Missing local page assets:\n${missing.join('\n')}`);
            process.exit(1);
          }
          NODE

  diagnosis-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify diagnosis search cards and capability buttons
        run: node Fortnite-Ai-Agent-GitHub-Cloudflare/diagnosis.browser.test.mjs


  layer8-site-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out FNAA
        uses: actions/checkout@v4

      - name: Check out NovaSparx main
        uses: actions/checkout@v4
        with:
          repository: E8uc/NovaSparx
          ref: main
          path: .novasparx

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install browser WASM workload
        run: dotnet workload install wasm-tools

      - name: Prepare NovaSparx runtime inside FNAA site
        shell: bash
        run: |
          set -euo pipefail

          dotnet publish \
            .novasparx/tools/CUE4Parse.BrowserProbe/CUE4Parse.BrowserProbe.csproj \
            --configuration Release

          output_root=".novasparx/tools/CUE4Parse.BrowserProbe/bin/Release/net10.0"
          dotnet_js="$(find "$output_root" -type f -path '*/_framework/dotnet.js' -print -quit)"
          test -n "$dotnet_js"

          framework_dir="$(dirname "$dotnet_js")"
          bundle="$(dirname "$framework_dir")"
          site="Fortnite-Ai-Agent-GitHub-Cloudflare"

          cp .novasparx/tools/CUE4Parse.BrowserProbe/main.js "$bundle/main.js"
          cp .novasparx/tools/CUE4Parse.BrowserProbe/worker.js "$bundle/worker.js"

          rm -rf \
            "$site/novasparx-runtime" \
            "$site/novasparx-location-index"

          mkdir -p \
            "$site/novasparx-runtime" \
            "$site/novasparx-location-index"

          cp -a "$bundle"/. "$site/novasparx-runtime/"
          cp -a .novasparx/web/location-index/. "$site/novasparx-location-index/"

          test -s "$site/novasparx-runtime/worker.js"
          test -s "$site/novasparx-runtime/_framework/dotnet.js"
          test -s "$site/novasparx-location-index/manifest.json"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Chromium test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Verify FNAA Layer 8 from site to visible image
        run: |
          node \
            Fortnite-Ai-Agent-GitHub-Cloudflare/layer8-site.browser.test.mjs \
            Fortnite-Ai-Agent-GitHub-Cloudflare

      - name: Preserve FNAA Layer 8 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fnaa-layer8-site-proof
          path: |
            fnaa-layer8-site-proof.json
            fnaa-layer8-site-preview.png
