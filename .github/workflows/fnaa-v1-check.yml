name: FNAA v1 check

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate-static-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          site='Fortnite-Ai-Agent-GitHub-Cloudflare'

          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(
            find "$site"               -type f               -name '*.js'               ! -path "$site/cloudflare-worker/*"               ! -path "$site/cloudflare-autolink/*"               -print0
          )

          # Cloudflare Workers are ES modules. Parse them explicitly as modules
          # so CI does not accidentally treat worker.js as CommonJS.
          node --input-type=module --check < "$site/cloudflare-worker/worker.js"
          node --input-type=module --check < "$site/cloudflare-autolink/worker.js"

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile Fortnite-Ai-Agent-GitHub-Cloudflare/build_database.py

      - name: Validate JSON assets
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const files = [
            'Fortnite-Ai-Agent-GitHub-Cloudflare/pak-setup-v42.json',
            'Fortnite-Ai-Agent-GitHub-Cloudflare/cloudflare-autolink/package.json'
          ];

          for (const file of files) {
            JSON.parse(fs.readFileSync(file, 'utf8'));
          }
          NODE

      - name: Run NovaSparx asset diagnosis self-test
        shell: bash
        run: node Fortnite-Ai-Agent-GitHub-Cloudflare/novasparx-associations.selftest.mjs

      - name: Run NovaSparx browser memory self-test
        shell: bash
        run: node Fortnite-Ai-Agent-GitHub-Cloudflare/novasparx-browser-guard.selftest.mjs

      - name: Run NovaSparx browser transport security self-test
        shell: bash
        run: node Fortnite-Ai-Agent-GitHub-Cloudflare/novasparx-browser-transport.selftest.mjs

      - name: Test Texture cancellation and output identity
        run: node Fortnite-Ai-Agent-GitHub-Cloudflare/novasparx-texture-runtime.selftest.mjs

      - name: Verify required site files
        shell: bash
        run: |
          set -euo pipefail
          site='Fortnite-Ai-Agent-GitHub-Cloudflare'
          required=(
            'index.html'
            '404.html'
            'style.css'
            'config.js'
            'auth.js'
            'novasparx-browser-guard.js'
            'novasparx-core.js'
            'novasparx-browser-transport.js'
            'novasparx-browser-transport.selftest.mjs'
            'novasparx-random-access.js'
            'novasparx-local-parser.js'
            'novasparx-texture-runtime.js'
            'novasparx-layers.js'
            'novasparx-associations.js'
            'novasparx-renderer.js'
            'novasparx-exporter.js'
            'preview.js'
            'tools.js'
            'app.js'
            'cloudflare-worker/worker.js'
            'cloudflare-worker/wrangler.jsonc'
            'cloudflare-autolink/worker.js'
            'cloudflare-autolink/wrangler.jsonc'
          )

          for file in "${required[@]}"; do
            test -s "$site/$file" || {
              echo "Missing or empty required file: $site/$file" >&2
              exit 1
            }
          done

      - name: Checkout verified NovaSparx Layer 8 runtime
        uses: actions/checkout@v4
        with:
          repository: E8uc/NovaSparx
          ref: 275f984d06db7b7cef2d61d334429b0465b873d0
          path: .novasparx-src
          fetch-depth: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install browser WASM workload
        run: dotnet workload install wasm-tools

      - name: Validate pinned Layer 8 browser bundle
        shell: bash
        run: |
          set -euo pipefail

          dotnet publish \
            .novasparx-src/tools/CUE4Parse.BrowserProbe/CUE4Parse.BrowserProbe.csproj \
            --configuration Release

          output_root=".novasparx-src/tools/CUE4Parse.BrowserProbe/bin/Release/net10.0"
          dotnet_js="$(find "$output_root" -type f -path '*/_framework/dotnet.js' -print -quit)"
          test -n "$dotnet_js"

          framework_dir="$(dirname "$dotnet_js")"
          bundle="$(dirname "$framework_dir")"
          target="Fortnite-Ai-Agent-GitHub-Cloudflare/novasparx-runtime"

          rm -rf "$target"
          mkdir -p "$target/location-index" "$target/studio-location-index" "$target/package-id-index" "$target/mappings"

          cp -a "$bundle"/. "$target"/
          cp .novasparx-src/tools/CUE4Parse.BrowserProbe/worker.js "$target/worker.js"
          cp -a .novasparx-src/web/location-index/. "$target/location-index/"
          cp -a .novasparx-src/web/studio-location-index/. "$target/studio-location-index/"
          cp -a .novasparx-src/web/package-id-index/. "$target/package-id-index/"

          mappings_meta="$(mktemp)"
          curl --fail --silent --show-error --location --retry 3 \
            "https://api.fortniteapi.com/v1/mappings" \
            -o "$mappings_meta"

          mapping_url="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1], encoding="utf-8")); candidates=[(str(item.get("uploadedAt") or ""), str(item.get("url") or "")) for item in data if isinstance(item,dict) and str((item.get("meta") or {}).get("platform") or "").lower()=="windows" and str(item.get("url") or "").startswith("https://") and "usmap" in str(item.get("url") or "").lower()]; candidates.sort(reverse=True); print(candidates[0][1] if candidates else ""); sys.exit(0 if candidates else 2)' "$mappings_meta")"

          test -n "$mapping_url"
          curl --fail --silent --show-error --location --retry 3 \
            "$mapping_url" \
            -o "$target/mappings/current.usmap"

          mapping_size="$(wc -c < "$target/mappings/current.usmap" | tr -d ' ')"
          test "$mapping_size" -ge 32
          test "$mapping_size" -le 33554432

          python3 -c 'from pathlib import Path; import sys; head=Path(sys.argv[1]).read_bytes()[:4]; sys.exit("Outer Zstandard-compressed mappings are not browser-compatible" if head == bytes.fromhex("28b52ffd") else 0)' "$target/mappings/current.usmap"

          sha256sum "$target/mappings/current.usmap" \
            > "$target/mappings/current.usmap.sha256"


          test -s "$target/worker.js"
          test -s "$target/_framework/dotnet.js"
          test -n "$(find "$target/_framework" -type f -name '*.wasm' -print -quit)"
          test -s "$target/location-index/manifest.json"
          test -s "$target/studio-location-index/manifest.json"
          test -s "$target/mappings/current.usmap"
          test -s "$target/mappings/current.usmap.sha256"

          grep -q 'resolve-texture-relay' "$target/worker.js"

      - name: Setup Node 24 for Layer 8 browser proof
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Layer 8 Chromium and WebKit runtimes
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium webkit

      - name: Prove FNAA Layer 8 in real Chromium
        shell: bash
        run: |
          set -euo pipefail
          FNAA_BROWSER_ENGINE=chromium \
            node .github/tests/novasparx-texture-runtime.browser.test.mjs \
            Fortnite-Ai-Agent-GitHub-Cloudflare

      - name: Prove FNAA Layer 8 in WebKit
        shell: bash
        run: |
          set -euo pipefail
          FNAA_BROWSER_ENGINE=webkit \
            node .github/tests/novasparx-texture-runtime.browser.test.mjs \
            Fortnite-Ai-Agent-GitHub-Cloudflare

      - name: Prove FNAA Layer 8 with iPhone WebKit profile
        shell: bash
        run: |
          set -euo pipefail
          FNAA_BROWSER_ENGINE=webkit \
          FNAA_MOBILE_PROFILE=ios \
            node .github/tests/novasparx-texture-runtime.browser.test.mjs \
            Fortnite-Ai-Agent-GitHub-Cloudflare

      - name: Prove FNAA Layer 8 with Android Chromium profile
        shell: bash
        run: |
          set -euo pipefail
          FNAA_BROWSER_ENGINE=chromium \
          FNAA_MOBILE_PROFILE=android \
            node .github/tests/novasparx-texture-runtime.browser.test.mjs \
            Fortnite-Ai-Agent-GitHub-Cloudflare

      - name: Preserve FNAA Layer 8 proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fnaa-layer8-browser-proof
          path: |
            fnaa-layer8-browser-proof.json
            fnaa-mesh-proof.json
            fnaa-real-mesh.png
          if-no-files-found: ignore

      - name: Verify local page assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const site = 'Fortnite-Ai-Agent-GitHub-Cloudflare';
          const html = fs.readFileSync(path.join(site, 'index.html'), 'utf8');
          const references = [...html.matchAll(/(?:src|href)="([^"#?]+)"/g)]
            .map((match) => match[1])
            .filter((value) => !/^(?:https?:|data:|mailto:|tel:|\/)/i.test(value));

          const missing = [...new Set(references)]
            .filter((value) => !fs.existsSync(path.join(site, value)));

          if (missing.length) {
            console.error(`Missing local page assets:\n${missing.join('\n')}`);
            process.exit(1);
          }
          NODE

  diagnosis-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify diagnosis search cards and capability buttons
        run: node Fortnite-Ai-Agent-GitHub-Cloudflare/diagnosis.browser.test.mjs
